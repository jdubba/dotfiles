# Stop waybar from spending its restart budget during a compositor restart.
#
# The failure is the mirror image of hyprpaper's (see the drop-in beside this
# one) and shares a cause: when Hyprland restarts mid-session the old Wayland
# socket vanishes, and both services are retried during the gap before the new
# compositor's socket exists.
#
# waybar does exit non-zero there, so Restart=on-failure is correct and is left
# alone. The problem is the pace. With systemd's 100ms default RestartSec it
# burned 7 restarts in roughly one second, hit the default limit of 5 starts per
# 10s, and systemd gave up permanently -- start-limit-hit, requiring a manual
# reset-failed. The compositor gap that triggered it was about three minutes.
#
# RestartSec=2 makes each attempt cost something, and StartLimitIntervalSec=0
# removes the ceiling so a gap of minutes is survivable rather than fatal. The
# retry is only reached via on-failure, so a clean exit still ends the service.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=2
