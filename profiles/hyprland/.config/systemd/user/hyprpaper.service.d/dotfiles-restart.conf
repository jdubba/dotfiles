# Keep hyprpaper retrying until the compositor is actually reachable.
#
# hyprpaper exits 0 when it cannot reach the compositor: it logs the Wayland
# platform error ("wl_display_connect failed (is a wayland compositor
# running?)") and then returns success. The shipped unit's Restart=on-failure
# reads that as a clean exit and never retries, so one lost race against a
# compositor restart leaves the wallpaper gone until someone starts the service
# by hand. Observed on stationzebra: inactive(dead) from 2026-08-13 to
# 2026-08-16 with no failed unit and nothing in `systemctl --user --failed` to
# point at it.
#
# Restart=always is the only setting that covers this, precisely because the
# exit status carries no information about whether the start worked.
#
# RestartSec=5 rather than systemd's 100ms default: what is being waited out is
# a compositor restart, which takes seconds, and a failed hyprpaper start costs
# ~33ms -- so 5s is well under 1% duty while still restoring the wallpaper
# within a few seconds of the compositor coming back.
#
# StartLimitIntervalSec=0 disables the rate limiter. Left at the default burst
# of 5 per 10s, retrying every 5s exhausts the budget in under a minute and the
# unit lands in failed -- which is the same "dead until a human notices" state
# this drop-in exists to remove, reached through a different door. Retrying
# indefinitely is safe here: PartOf=graphical-session.target still stops the
# unit when the session ends, and a manual `systemctl --user stop` is not a
# restart trigger.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
