# Point swaync at the generated, machine-local config instead of
# ~/.config/swaync/config.json.
#
# swaync has no include mechanism and no runtime output command, so its monitor
# pin lives in the config file — and on a dock that value is only knowable at
# runtime. Keeping the real config in machine-local state means a redock rewrites
# it without touching the repo. The tracked template is
# ~/.config/swaync/config.json.in; swaync-config.sh renders it.
#
# ExecStart must be cleared before being reset — systemd appends otherwise, and
# a Type=dbus service with two ExecStart lines fails to start.
#
# ExecStartPre is prefixed with '-' so a template that is missing (e.g. a
# half-linked fresh machine) leaves swaync starting from whatever config it
# finds rather than failing the unit outright.
#
# This drop-in is guard-free, like the shared kanshi.service: the dual-session
# ConditionEnvironment belongs in the Fedora host layer.
[Service]
ExecStartPre=-%h/.config/swaync/swaync-config.sh
ExecStart=
ExecStart=/usr/bin/swaync -c %S/dotfiles/swaync/config.json
