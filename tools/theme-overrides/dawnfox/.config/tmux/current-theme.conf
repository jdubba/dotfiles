# dawnfox tmux colors
set -g pane-border-style fg=#938aa4
set -g pane-active-border-style fg=#6e33ce
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#575279,fg=#faf4ed'
set -g status-left '#[fg=#e3cdb4]#S #[fg=#bcd3dd]|'
set -g status-right '#[fg=#bcd3dd]%Y-%m-%d #[fg=#faf4ed]%H:%M #[fg=#e3cdb4][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#faf4ed,fg=#ac5402,bold] #I:#W #[default]'
