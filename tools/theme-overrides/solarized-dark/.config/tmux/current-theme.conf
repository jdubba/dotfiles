# solarized-dark tmux colors -- hand-tuned.
# Byte-identical to solarized-light: c15 as the ink on both surfaces means this
# seam does not depend on the ground at all, so the two polarities share it whole.
set -g pane-border-style fg=#586e75
set -g pane-active-border-style fg=#6c71c4
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#d33682,fg=#fdf6e3'
set -g status-left '#[fg=#fdf6e3,bold]#S #[fg=#fdf6e3]|'
set -g status-right '#[fg=#fdf6e3]%Y-%m-%d #[fg=#fdf6e3,bold]%H:%M #[fg=#fdf6e3][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#6c71c4,fg=#fdf6e3,bold] #I:#W #[default]'
