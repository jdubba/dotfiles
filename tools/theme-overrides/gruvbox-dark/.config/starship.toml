# Commands may be slower in restricted environments, e.g. containers
command_timeout = 10000

format = """
  $time
[    ](fg:color_fg_sep)\
$localip\
[ / ](fg:color_fg_sep)\
$custom\
[ ](fg:color_fg_sep)
[┌─](fg:color_connector)\
[](fg:color_os_bg)\
$os\
$username\
$hostname\
[](fg:color_os_bg bg:color_dir_bg)\
$directory\
[](fg:color_dir_bg)\
$fill\
$git_branch\
$git_status
[└](fg:color_connector)$character"""


palette = 'starship_dubba'

[palettes.starship_dubba]
# Hand-tuned to the two waybar pill accents, so the prompt and the bar read as
# one system: yellow #d79921 (the theme pill) for os/user/host, then blue
# #458588 (the left/right pills) for path/repo. The generated palette instead
# spread five hues across the prompt and left the repo-root name at 1.33:1
# (#689d6a on #458588 -- effectively invisible).
#
# The two accents also keep the powerline separator between the segments
# readable; when both sides were blue it vanished entirely.
#
# Note #458588 is mid-luminance: nothing on it exceeds ~4:1, so within the blue
# segment the text is split by polarity instead of hue -- cream path text
# (3.73:1) against a dark "ink" repo-root name (3.88:1, the on-palette max).
color_fg_primary = '#fbf1c7'
# The os/user/host segment takes the yellow accent -- the same #d79921 the
# waybar theme pill uses -- so it stays visually distinct from the blue
# path/repo segment that follows it. It needs its own foreground because
# color_fg_primary is shared with the directory and git-status segments, which
# stay cream; here the yellow demands a dark fg (6.61:1).
color_os_bg = '#d79921'
color_os_fg = '#1d2021'
color_time_bg = '#458588'
color_dir_bg = '#458588'
color_dir_repo_fg = '#1d2021'
color_red = '#fb4934'
# Connector rules are hairlines on the terminal background, so they use the
# bright blue (5.48:1) rather than the pill blue (3.48:1).
color_connector = '#83a598'
# Git segments sit on gruvbox bg neutrals -- all comfortably above AA.
color_repo_fg = '#ebdbb2'
color_repo_bg = '#3c3836'
color_repo_change_fg = '#ebdbb2'
color_repo_change_bg = '#504945'
color_repo_diverge_fg = '#1d2021'
color_repo_diverge_bg = '#83a598'
color_fg_right = '#a89984'
color_fg_sep = '#928374'
[fill]
symbol = " "

[os]
style = "fg:color_os_fg bg:color_os_bg"
format = "[$symbol  ]($style)"
disabled = false

[os.symbols]
Windows = "" #""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ''

[username]
disabled = false
show_always = true
# os_bg is the yellow accent here, so ANSI yellow would be invisible on it --
# root gets the red accent instead, which is both legible (4.77:1) and louder.
style_root = "fg:#1d2021 bg:color_red"
style_user = "fg:color_os_fg bg:color_os_bg"
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = false
style = "fg:color_os_fg bg:color_os_bg"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 3
truncate_to_repo = false
repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
#repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
fish_style_pwd_dir_length = 2
# Repo format
repo_root_format = "[  $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)"
# Non repo format
format = "[  $path ]($style)"
style = "fg:color_fg_primary bg:color_dir_bg"

[git_branch]
format = '[](fg:color_repo_bg)[ $symbol$branch ]($style)'
symbol = "at  on  "
style = "fg:color_repo_fg bg:color_repo_bg"

[git_status]
stashed = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
modified = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
staged = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
untracked = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
deleted = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
ahead = " [${count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
behind = " [${count} ](fg:color_repo_diverge_fg bg:color_repo_diverge_bg)"
diverged = " [${ahead_count} ${behind_count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
format = """
[](fg:color_repo_change_bg bg:color_repo_bg)\
[ ](bg:color_repo_change_bg)\
([$stashed]($style))\
([$modified]($style))\
([$staged]($style))\
([$untracked]($style))\
([$deleted]($style))\
[](fg:color_repo_diverge_bg bg:color_repo_change_bg)\
([$ahead_behind](fg:color_repo_diverge_fg bg:color_repo_diverge_bg))\
[](fg:color_repo_diverge_bg)"""
style = "fg:color_fg_primary bg:color_repo_change_bg"

[character]
success_symbol = '[─](fg:color_connector)'
error_symbol = '[─](fg:color_connector)[✗](fg:color_red)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:color_fg_right"
format = "([  $time]($style))"

[localip]
ssh_only = false
style = "fg:color_fg_right"
format = "[$localipv4]($style)"
disabled = false

[custom.externalip]
command = "printf $EXTERNAL_IP"
style = "fg:color_fg_right"
format = "[$output]($style)"
when = "true"
