# catppuccin-mocha tmux colors — tuned to match the bar and prompt
#
# The status bar is the palette's yellow, which makes it the one light surface in
# an otherwise dark theme, so every ink on it inverts. That has a consequence
# worth stating, because it drives the whole scheme: on a light bar emphasis IS
# darkness, so a hued accent can never out-rank plain text -- the darkest thing
# available is near-black, and any pink or green dark enough to read on yellow
# lands at 4-5:1 while base #1e1e2e reads 12.91:1. Colouring the current window
# green (as this file did when the bar was dark) would therefore have made it
# *less* prominent than every other window.
#
# So the current window is an inverted chip instead: a dark green block with
# yellow text, 5.02:1 both ways. That is unmistakable as "here" and still carries
# the green that means "current" everywhere else in this theme -- walker's
# selected row, kitty's active tab, btop's selection, hyprlock's glow.
#
# The rest is a three-step ink ramp on the yellow rather than a set of hues:
#   #1e1e2e  12.91:1  session name and clock -- what you actually glance at
#   #45475a   7.18:1  base text and inactive windows
#   #a29372   2.38:1  separators; yellow mixed 35% toward black, deliberately
#                     receding, since on a light bar chrome has to get LIGHTER
# Dark pink #6e5768 (5.12:1, pink mixed 55% toward black) keeps the username as
# the identity accent, matching the pink the pane border and the bar pills use.
#
# Pane borders are NOT on the status bar -- they sit on the terminal background,
# so they keep dark-theme values: pink active at 10.74:1, surface1 inactive at
# 1.80:1 (chrome, deliberately faint).
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#f5c2e7
# status-style is the modern option; status-bg/status-fg are the deprecated pair
# it replaced. Setting status-bg does not update status-style, but at render time
# the deprecated pair WINS -- verified by capturing what a client emits. Since
# options live in the server rather than the config, a long-running server that
# ever sourced an older seam still holds its status-bg and would override this
# forever, so clear them first. `set -gu` is idempotent.
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#f9e2af,fg=#45475a'
set -g status-left '#[fg=#1e1e2e,bold]#S #[fg=#a29372]|'
set -g status-right '#[fg=#45475a]%Y-%m-%d #[fg=#1e1e2e]%H:%M #[fg=#a29372]| #[fg=#6e5768,bold][#(whoami)]'
setw -g window-status-format '#[fg=#45475a]#I:#W'
setw -g window-status-current-format '#[fg=#f9e2af,bg=#4b6648,bold] #I:#W #[default]'
