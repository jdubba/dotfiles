# Commands may be slower in restricted environments, e.g. containers
command_timeout = 10000

format = """
  $time
[    ](fg:color_fg_sep)\
$localip\
[ / ](fg:color_fg_sep)\
$custom\
[ ](fg:color_fg_sep)
[┌─](fg:color_connector)\
[](fg:color_os_bg)\
$os\
$username\
$hostname\
[](fg:color_os_bg bg:color_dir_bg)\
$directory\
[](fg:color_dir_bg)\
$fill\
$git_branch\
$git_status
[└](fg:color_connector)$character"""


palette = 'starship_dubba'

[palettes.starship_dubba]
# Hand-tuned to match the bar, which takes its accents from the wallpaper:
# c13 pink #f5c2e7 for the path and repo segments, c2 green for the connector
# rules. The os/user segment deliberately keeps the neutral surface1 the
# generator gave it -- a dark anchor at the start of the line.
#
# Shared by the os/user segment and the git-status change counts, both of which
# sit on dark surfaces. The path and repo segments are on light accents and take
# their own dark inks below.
color_fg_primary = '#cdd6f4'
# os/user/host: surface1, with the light shared ink at 6.30:1. This is the one
# segment that must NOT take a dark ink -- #1e1e2e on #45475a is 1.79:1.
color_os_bg = '#45475a'
color_time_bg = '#f5c2e7'
# Path segment takes the pink accent, so it needs its own dark foreground --
# color_fg_primary is shared with os/user and the git-status counts, which stay
# light. bg #1e1e2e on the pink is 10.74:1.
color_dir_bg = '#f5c2e7'
color_dir_fg = '#1e1e2e'
# The repo-root name inside the path pill: c4 blue mixed 55% toward the ink,
# 4.42:1 against the pink.
#
# This pairing has no good answer, only a chosen trade. On a light pill every
# legible ink is dark, so a colour cannot be both readable against the pill and
# distinguishable from the #1e1e2e path text beside it -- raw blue is vivid and
# obviously separate but measures 1.37:1 and can't really be read. Readability
# wins here because the git pills to the right already announce that this is a
# repo; the repo-root highlight does not have to carry that signal alone.
# repo_root_style therefore also takes `bold`, which is the only differentiator
# left once both runs are dark inks.
color_dir_repo_fg = '#495c7c'
color_red = '#f38ba8'
# Connector rules are hairlines on the terminal background: c2 green at 11.03:1,
# up from the generated blue's 7.78:1.
color_connector = '#a6e3a1'
# Git branch pill shares the path's pink. The generated palette put the shared
# light ink here, which measured 1.05:1 -- the branch name was invisible. Dark
# ink instead: 10.74:1.
color_repo_fg = '#1e1e2e'
color_repo_bg = '#f5c2e7'
# Change counts sit on surface2, where the light shared ink is 4.61:1.
color_repo_change_fg = '#cdd6f4'
color_repo_change_bg = '#585b70'
# Ahead/behind counts sit on the blue accent. The generated light ink measured
# 1.45:1 here -- also invisible. Dark ink: 7.78:1.
color_repo_diverge_fg = '#1e1e2e'
color_repo_diverge_bg = '#89b4fa'
color_fg_right = '#a6adc8'
color_fg_sep = '#585b70'
[fill]
symbol = " "

[os]
style = "fg:color_fg_primary bg:color_os_bg"
format = "[$symbol  ]($style)"
disabled = false

[os.symbols]
Windows = "" #""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ''

[username]
disabled = false
show_always = true
style_root = "fg:yellow bg:color_os_bg"
style_user = "fg:color_fg_primary bg:color_os_bg"
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = false
style = "fg:color_fg_primary bg:color_os_bg"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 3
truncate_to_repo = false
repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg bold"
#repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
fish_style_pwd_dir_length = 2
# Repo format
repo_root_format = "[  $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)"
# Non repo format
format = "[  $path ]($style)"
style = "fg:color_dir_fg bg:color_dir_bg"

[git_branch]
format = '[](fg:color_repo_bg)[ $symbol$branch ]($style)'
symbol = "at  on  "
style = "fg:color_repo_fg bg:color_repo_bg"

[git_status]
stashed = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
modified = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
staged = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
untracked = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
deleted = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
ahead = " [${count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
behind = " [${count} ](fg:color_repo_diverge_fg bg:color_repo_diverge_bg)"
diverged = " [${ahead_count} ${behind_count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
format = """
[](fg:color_repo_change_bg bg:color_repo_bg)\
[ ](bg:color_repo_change_bg)\
([$stashed]($style))\
([$modified]($style))\
([$staged]($style))\
([$untracked]($style))\
([$deleted]($style))\
[](fg:color_repo_diverge_bg bg:color_repo_change_bg)\
([$ahead_behind](fg:color_repo_diverge_fg bg:color_repo_diverge_bg))\
[](fg:color_repo_diverge_bg)"""
style = "fg:color_fg_primary bg:color_repo_change_bg"

[character]
success_symbol = '[─](fg:color_connector)'
error_symbol = '[─](fg:color_connector)[✗](fg:color_red)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:color_fg_right"
format = "([  $time]($style))"

[localip]
ssh_only = false
style = "fg:color_fg_right"
format = "[$localipv4]($style)"
disabled = false

[custom.externalip]
command = "printf $EXTERNAL_IP"
style = "fg:color_fg_right"
format = "[$output]($style)"
when = "true"
