# catppuccin-mocha hypr/hyprlock colors.
#
# Two deviations from the generated seam, both at the bottom of the section they
# affect: $mauve carries hyprlock's accent, and $active_border is the focused
# window's gradient. Everything else is the emitter's slot mapping.
$rosewater = rgb(a6adc8)
$rosewaterAlpha = a6adc8
$flamingo = rgb(a6adc8)
$flamingoAlpha = a6adc8
$pink = rgb(f5c2e7)
$pinkAlpha = f5c2e7
# hyprlock's $accent is bound to $mauve in the shared hyprlock.conf, so this is
# the seam for the lock screen's glow: the 4px input-field outline, the avatar
# border, the checking-state colour and the username in the placeholder. c2
# green, matching walker's selection -- 6.13:1 against the field's $surface0
# interior, and it is the one accent that reads against a blurred wallpaper of
# this theme's own violets.
$mauve = rgb(a6e3a1)
$mauveAlpha = a6e3a1
$red = rgb(f38ba8)
$redAlpha = f38ba8
$maroon = rgb(f38ba8)
$maroonAlpha = f38ba8
