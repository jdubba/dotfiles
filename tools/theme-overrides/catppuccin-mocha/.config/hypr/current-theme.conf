# Focused window border: the two colours the rest of this theme is built on --
# c2 green (the workspaces surface, walker's selection) and pink (the bar pills,
# the prompt's path pill) -- as the gradient's endpoints, so the focus ring
# sweeps between them. The generated pair ended on c4 blue, which appears
# nowhere else in this theme's chrome except the switcher pill.
#
# The pink end is NOT the raw c13 #f5c2e7. At border_size = 2 a colour that pale
# (chroma 51) reads as white rather than pink -- there are too few pixels for the
# eye to judge a low-chroma hue. This is c13's hue held at 316deg with saturation
# taken to 100% and lightness dropped to 80%, giving chroma 102 -- deliberately
# matched to c1 red's 104, the most saturated slot this palette ships, so the
# border pops without stepping outside the theme's own vocabulary.
$active_border = rgba(a6e3a1ee) rgba(ff99e3ee) 45deg
$inactive_border = rgba(585b70aa)
$shadow_color = rgba(1e1e2eee)
