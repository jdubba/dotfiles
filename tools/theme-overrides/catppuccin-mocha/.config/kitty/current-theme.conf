# catppuccin-mocha kitty colors — tuned to match the bar and prompt
#
# The 16-slot palette below is a verbatim copy of the emitter's output, and for
# this flavour it is also identical to catppuccin's official kitty theme. Because
# a kitty theme is one file, an override pins the whole thing, so a future change
# to this theme's registry row has to be mirrored here by hand.
#
# Four departures from the generated file, matching the treatment
# catppuccin-macchiato's override already documents:
#   1. selection_background moves from surface2 to surface1. Selected text was
#      4.61:1 on surface2 -- over AA, but only just; on surface1 it reads 6.30:1.
#      (The vendor ghostty file solves the same problem with its own #353749,
#      which is why the two terminals differ here.)
#   2. The cursor is rosewater, catppuccin's own convention for it, and the
#      value both vendor ghostty files use. It beats the generated choice on
#      visibility, 12.94:1 against 11.34:1, and because it is a colour the text
#      never uses, the caret cannot be mistaken for a character.
#      cursor_text_color is set for completeness but is inert here: kitty.conf
#      sets cursor_shape beam, so no text sits under the caret. It matters in
#      ghostty, which keeps the default block.
#   3. Window borders follow the bar: pink for active, the accent the primary
#      pills and the prompt's path pill share (10.74:1). Inactive drops to
#      surface1, which recedes at 1.79:1 -- deliberate, it is chrome.
#   4. Tab-bar colours, which the emitter does not emit at all, so kitty was
#      falling back to its built-in defaults. The active tab is green, this
#      theme's "current thing" accent -- walker's selected row and hyprlock's
#      glow are the same green -- with the palette's darkest ink on it (11.03:1).
#      url_color stays the generated blue: a link is a link, not an accent.
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #cdd6f4
selection_background    #45475a
url_color               #89b4fa
cursor                  #f5e0dc
cursor_text_color       #11111b
active_border_color     #f5c2e7
inactive_border_color   #45475a
active_tab_foreground   #1e1e2e
active_tab_background   #a6e3a1
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #a6adc8
color8  #585b70
