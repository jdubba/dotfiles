# Commands may be slower in restricted environments, e.g. containers
command_timeout = 10000

format = """
  $time
[    ](fg:color_fg_sep)\
$localip\
[ / ](fg:color_fg_sep)\
$custom\
[ ](fg:color_fg_sep)
[┌─](fg:color_connector)\
[](fg:color_os_bg)\
$os\
$username\
$hostname\
[](fg:color_os_bg bg:color_dir_bg)\
$directory\
[](fg:color_dir_bg)\
$fill\
$git_branch\
$git_status
[└](fg:color_connector)$character"""


palette = 'starship_dubba'

[palettes.starship_dubba]
# Hand-tuned to the two waybar pill accents, mirroring gruvbox-dark: yellow
# #d79921 (the theme pill) for os/user/host, then blue #076678 (the unified
# pills) for path/repo. The generated palette had four failing pairs, because it
# put the light theme's dark foreground #3c3836 on mid-luminance backgrounds:
#   #3c3836 on #458588  2.74:1   (os, directory and diverge segments)
#   #689d6a on #458588  1.33:1   (repo-root name -- effectively invisible)
#   #3c3836 on #b16286  2.74:1   (git branch)
#
# Unlike gruvbox-dark -- where #458588 capped every pairing at ~4:1 -- the
# light-mode blue #076678 takes cream text at 5.82:1, so this palette clears AA
# nearly everywhere.
color_fg_primary = '#fbf1c7'
# os/user/host needs its own foreground: color_fg_primary is shared with the
# directory and git-status segments, and yellow demands dark text (4.68:1).
color_os_bg = '#d79921'
color_os_fg = '#3c3836'
color_time_bg = '#076678'
color_dir_bg = '#076678'
# Yellow against the dark blue -- distinct in hue from the cream path text, and
# the best available here (3.89:1; cream-on-cream would be indistinguishable).
color_dir_repo_fg = '#fabd2f'
# Light-mode red: 7.60:1 on the terminal background, vs 4.82:1 for #cc241d.
color_red = '#9d0006'
# Connector hairlines sit on the light terminal background, so they need a dark
# tone -- the pill blue itself works here (5.82:1).
color_connector = '#076678'
# Git segments sit on gruvbox light bg neutrals with dark text -- all above AA.
color_repo_fg = '#3c3836'
color_repo_bg = '#ebdbb2'
color_repo_change_fg = '#3c3836'
color_repo_change_bg = '#d5c4a1'
color_repo_diverge_fg = '#f9f5d7'
color_repo_diverge_bg = '#427b58'
color_fg_right = '#7c6f64'
color_fg_sep = '#928374'
[fill]
symbol = " "

[os]
style = "fg:color_os_fg bg:color_os_bg"
format = "[$symbol  ]($style)"
disabled = false

[os.symbols]
Windows = "" #""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ''

[username]
disabled = false
show_always = true
# os_bg is the yellow accent here, so ANSI yellow would be invisible on it --
# root gets the red accent instead (cream on #9d0006, 7.60:1).
style_root = "fg:#fbf1c7 bg:color_red"
style_user = "fg:color_os_fg bg:color_os_bg"
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = false
style = "fg:color_os_fg bg:color_os_bg"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 3
truncate_to_repo = false
repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
#repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
fish_style_pwd_dir_length = 2
# Repo format
repo_root_format = "[  $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)"
# Non repo format
format = "[  $path ]($style)"
style = "fg:color_fg_primary bg:color_dir_bg"

[git_branch]
format = '[](fg:color_repo_bg)[ $symbol$branch ]($style)'
symbol = "at  on  "
style = "fg:color_repo_fg bg:color_repo_bg"

[git_status]
stashed = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
modified = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
staged = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
untracked = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
deleted = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
ahead = " [${count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
behind = " [${count} ](fg:color_repo_diverge_fg bg:color_repo_diverge_bg)"
diverged = " [${ahead_count} ${behind_count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
format = """
[](fg:color_repo_change_bg bg:color_repo_bg)\
[ ](bg:color_repo_change_bg)\
([$stashed]($style))\
([$modified]($style))\
([$staged]($style))\
([$untracked]($style))\
([$deleted]($style))\
[](fg:color_repo_diverge_bg bg:color_repo_change_bg)\
([$ahead_behind](fg:color_repo_diverge_fg bg:color_repo_diverge_bg))\
[](fg:color_repo_diverge_bg)"""
# NOT color_fg_primary: that is cream for the dark blue directory segment, and
# this background is a light neutral -- the pair would be ~1.3:1.
style = "fg:color_repo_change_fg bg:color_repo_change_bg"

[character]
success_symbol = '[─](fg:color_connector)'
error_symbol = '[─](fg:color_connector)[✗](fg:color_red)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:color_fg_right"
format = "([  $time]($style))"

[localip]
ssh_only = false
style = "fg:color_fg_right"
format = "[$localipv4]($style)"
disabled = false

[custom.externalip]
command = "printf $EXTERNAL_IP"
style = "fg:color_fg_right"
format = "[$output]($style)"
when = "true"
