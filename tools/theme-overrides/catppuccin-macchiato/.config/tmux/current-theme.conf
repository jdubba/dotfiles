# catppuccin-macchiato tmux colors — light status bar
#
# The bar is deliberately a LIGHT surface (subtext1) so it separates from the
# terminal background it sits above: 8.17:1 against #24273a, where the generated
# theme used the terminal's own #24273a and the bar had no edge at all.
#
# That inverts every colour on it. The palette's accents are all light, so none of
# them survives on a light bar -- teal, sage and yellow land at 1.3-1.5:1 there,
# and periwinkle and mauve at ~1.0:1. Each accent is therefore mixed 75% toward
# crust, which keeps its hue but flips it to ink. Measured on the bar:
#
#   dark teal    #35484f  5.32:1     dark mauve   #443b5a  5.77:1
#   dark sage    #3c4942  5.24:1     dark rose    #4d3542  6.12:1
#   dark yellow  #4e4844  4.99:1     base ink     #24273a  8.17:1
#
# 75% is the stop where every accent clears 4.5 on this bar; at 65% teal, sage and
# yellow fall short. subtext0 was tried as the bar first and is slightly too dark
# for that -- it caps those three at ~4.2 even at 75%.
#
# Pane borders are the exception: they are drawn on the TERMINAL background, not on
# the bar, so they keep the light accents. Mauve is the active border there and the
# dark mauve is the current window here -- the same "this is the current thing"
# accent the bar's workspace dot, btop's hi_fg and kitty's active tab use, with the
# ink flipped to suit whichever surface it lands on.
set -g pane-border-style fg=#494d64
set -g pane-active-border-style fg=#c6a0f6
set -g status-bg '#b8c0e0'
set -g status-fg '#24273a'
set -g status-left '#[fg=#35484f,bold]#S #[fg=#5b6078]|'
set -g status-right '#[fg=#35484f]%Y-%m-%d #[fg=#24273a,bold]%H:%M #[fg=#4e4844][#(whoami)]'
# Inactive windows sit at 3.44:1 -- present and readable, but quieter than the
# current one, which is what separates them on a light bar where "darker" reads as
# "more important".
setw -g window-status-format '#[fg=#5b6078]#I:#W'
setw -g window-status-current-format '#[fg=#443b5a,bold]#I:#W#[default]'
