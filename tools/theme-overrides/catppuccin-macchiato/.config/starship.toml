# Commands may be slower in restricted environments, e.g. containers
command_timeout = 10000

format = """
  $time
[    ](fg:color_fg_sep)\
$localip\
[ / ](fg:color_fg_sep)\
$custom\
[ ](fg:color_fg_sep)
[┌─](fg:color_connector)\
[](fg:color_os_bg)\
$os\
$username\
$hostname\
[](fg:color_os_bg bg:color_dir_bg)\
$directory\
[](fg:color_dir_bg)\
$fill\
$git_branch\
$git_status
[└](fg:color_connector)$character"""


palette = 'starship_dubba'

[palettes.starship_dubba]
color_fg_primary = '#cad3f5'
# Mirrors the waybar bar: sage green for the os/user pill, periwinkle for the
# directory pill, dusty rose for the connectors.
#
# color_fg_primary stays light because git-status draws on a dark surface, so
# both accent pills need their own ink -- hence color_os_fg and color_dir_fg.
# Each accent is a mid-luminance saturated surface, where only a near-black or
# near-white ink is legible, so both inks come from the dark end of macchiato's
# own greys rather than from a hue.
color_os_bg = '#a6da95'
color_os_fg = '#181926'
color_time_bg = '#f5bde6'
color_dir_bg = '#8aadf4'
# The path reads at 4.99:1 and the repo name at 7.77:1, so the repo root is the
# stronger of the two -- emphasis by tone, since no hue survives on periwinkle.
color_dir_fg = '#363a4f'
color_dir_repo_fg = '#181926'
color_red = '#ed8796'
color_connector = '#ed8796'
color_repo_fg = '#cad3f5'
color_repo_bg = '#f5bde6'
color_repo_change_fg = '#cad3f5'
color_repo_change_bg = '#5b6078'
color_repo_diverge_fg = '#cad3f5'
color_repo_diverge_bg = '#8aadf4'
color_fg_right = '#b8c0e0'
color_fg_sep = '#5b6078'
[fill]
symbol = " "

[os]
style = "fg:color_os_fg bg:color_os_bg"
format = "[$symbol  ]($style)"
disabled = false

[os.symbols]
Windows = "" #""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ''

[username]
disabled = false
show_always = true
# Root can no longer be flagged with ANSI yellow ink: os_bg is a light accent
# now, so yellow-on-sage is illegible. Turn the whole pill dusty rose instead
# (7.05:1 with the same ink), which also reads as alarming at a glance.
style_root = "fg:color_os_fg bg:color_red"
style_user = "fg:color_os_fg bg:color_os_bg"
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = false
style = "fg:color_os_fg bg:color_os_bg"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 3
truncate_to_repo = false
repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
#repo_root_style = "fg:color_dir_repo_fg bg:color_dir_bg"
fish_style_pwd_dir_length = 2
# Repo format
repo_root_format = "[  $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)"
# Non repo format
format = "[  $path ]($style)"
style = "fg:color_dir_fg bg:color_dir_bg"

[git_branch]
format = '[](fg:color_repo_bg)[ $symbol$branch ]($style)'
symbol = "at  on  "
style = "fg:color_repo_fg bg:color_repo_bg"

[git_status]
stashed = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
modified = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
staged = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
untracked = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
deleted = "[${count}](fg:color_repo_change_fg bg:color_repo_change_bg) "
ahead = " [${count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
behind = " [${count} ](fg:color_repo_diverge_fg bg:color_repo_diverge_bg)"
diverged = " [${ahead_count} ${behind_count}](fg:color_repo_diverge_fg bg:color_repo_diverge_bg) "
format = """
[](fg:color_repo_change_bg bg:color_repo_bg)\
[ ](bg:color_repo_change_bg)\
([$stashed]($style))\
([$modified]($style))\
([$staged]($style))\
([$untracked]($style))\
([$deleted]($style))\
[](fg:color_repo_diverge_bg bg:color_repo_change_bg)\
([$ahead_behind](fg:color_repo_diverge_fg bg:color_repo_diverge_bg))\
[](fg:color_repo_diverge_bg)"""
style = "fg:color_fg_primary bg:color_repo_change_bg"

[character]
success_symbol = '[─](fg:color_connector)'
error_symbol = '[─](fg:color_connector)[✗](fg:color_red)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:color_fg_right"
format = "([  $time]($style))"

[localip]
ssh_only = false
style = "fg:color_fg_right"
format = "[$localipv4]($style)"
disabled = false

[custom.externalip]
command = "printf $EXTERNAL_IP"
style = "fg:color_fg_right"
format = "[$output]($style)"
when = "true"
