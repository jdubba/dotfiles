background              #24273a
selection_foreground    #cad3f5
selection_background    #494d64
url_color               #8aadf4
color0  #494d64
color1  #ed8796
color2  #a6da95
color3  #eed49f
color4  #8aadf4
color5  #f5bde6
color6  #8bd5ca
color7  #a5adcb
color8  #5b6078
color9  #ed8796
color10 #a6da95
