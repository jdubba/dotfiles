# catppuccin-macchiato kitty colors — tuned to match the bar and prompt
#
# The 16-slot palette below is a verbatim copy of the emitter's output. Because a
# kitty theme is one file, an override pins the whole thing, so a future change to
# this theme's registry row (as the color7/color15 un-swap was) has to be mirrored
# here by hand.
#
# Four departures from the generated file:
#   1. selection_background moves from surface2 to surface1. Selected text was
#      4.17:1 on surface2 -- under AA, and the emitter's selection pairing fails
#      this way in 26 of 40 themes. On surface1 it reads 5.59:1.
#   2. The cursor is rosewater, catppuccin's own convention for it (both vendor
#      ghostty files in tools/theme-overrides use it). It beats the generated
#      choice on visibility, 11.18:1 against 9.92:1, and because it is a colour
#      the text never uses, the caret cannot be mistaken for a character.
#      cursor_text_color is set for completeness but is close to inert here:
#      kitty.conf sets cursor_shape beam, so no text sits under the caret. It
#      matters in ghostty, which keeps the default block.
#   3. Window borders follow the bar: teal for active, the accent walker's chrome
#      and the bar's primary pills share. Inactive drops to surface0, which
#      recedes at 1.31:1 -- deliberate, it is chrome.
#   4. Tab-bar colours, which the emitter does not emit at all, so kitty was
#      falling back to its built-in defaults. The active tab is mauve, matching
#      the active workspace dot in waybar and hi_fg in btop -- mauve is this
#      theme's "current thing" accent throughout.
