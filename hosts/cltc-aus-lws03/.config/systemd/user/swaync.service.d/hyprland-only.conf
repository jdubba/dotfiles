# cltc-aus-lws03 is a dual GNOME+Hyprland (GDM) Fedora box; graphical-session.target
# is reached under both. Gate swaync to the Hyprland session only. Depends on the
# session env being imported into the systemd --user manager, which
# hosts/cltc-aus-lws03/.config/hypr/local.conf does
# (dbus-update-activation-environment) on Hyprland start.
#
# This guard matters more than the kanshi/waybar ones. GNOME provides
# org.freedesktop.Notifications itself, so an unguarded swaync would not merely
# run pointlessly under GNOME -- it would race GNOME's own daemon for the bus
# name and one of them would lose. The unit shipped by the package guards only
# on ExecCondition=[ -n "$WAYLAND_DISPLAY" ], which GNOME also satisfies, so
# that is no help here.
#
# Note this directory is owned by TWO layers: profiles/hyprland contributes
# dotfiles-config.conf (the generated-config -c override) and this host adds the
# session guard. Both are linked as individual children rather than the
# directory being folded.
[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland
