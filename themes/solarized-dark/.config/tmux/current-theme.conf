# solarized-dark tmux colors
set -g pane-border-style fg=#586e75
set -g pane-active-border-style fg=#b58900
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#7f9193,fg=#002b36'
set -g status-left '#[fg=#002b36,bold]#S #[fg=#002b36]|'
set -g status-right '#[fg=#002b36]%Y-%m-%d #[fg=#002b36,bold]%H:%M #[fg=#002b36][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#b58900,fg=#002b36,bold] #I:#W #[default]'
