# onedark tmux colors
set -g pane-border-style fg=#545862
set -g pane-active-border-style fg=#61afef
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#8e95a0,fg=#282c34'
set -g status-left '#[fg=#282c34,bold]#S #[fg=#282c34]|'
set -g status-right '#[fg=#282c34]%Y-%m-%d #[fg=#282c34,bold]%H:%M #[fg=#282c34][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#61afef,fg=#282c34,bold] #I:#W #[default]'
