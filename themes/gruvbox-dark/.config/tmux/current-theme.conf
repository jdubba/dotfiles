# gruvbox-dark tmux colors
set -g pane-border-style fg=#928374
set -g pane-active-border-style fg=#fabd2f
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#c0b494,fg=#282828'
set -g status-left '#[fg=#282828,bold]#S #[fg=#544426]|'
set -g status-right '#[fg=#3b4b3c]%Y-%m-%d #[fg=#282828,bold]%H:%M #[fg=#544426][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#fabd2f,fg=#282828,bold] #I:#W #[default]'
