# ayu-light tmux colors
set -g pane-border-style fg=#8a9199
set -g pane-active-border-style fg=#a37acc
# status-style, not the deprecated status-bg/status-fg pair: on tmux 3.5a those
# do not feed what renders, leaving the default bg=green,fg=black in place.
# Clear the deprecated pair first: it takes precedence over status-style at
# render time, and lives in the server, so a stale value from an older seam
# would override this forever.
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#e6e1cf,fg=#5c6166'
set -g status-left '#[fg=#4cbf99]#S #[fg=#f2ae49]|'
set -g status-right '#[fg=#4cbf99]%Y-%m-%d #[fg=#5c6166]%H:%M #[fg=#f07171][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[fg=#5c6166,bold]#I:#W#[default]'
