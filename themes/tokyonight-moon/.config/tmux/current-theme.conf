# tokyonight-moon tmux colors
set -g pane-border-style fg=#444a73
set -g pane-active-border-style fg=#c3e88d
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#a3adcb,fg=#222436'
set -g status-left '#[fg=#222436,bold]#S #[fg=#433c40]|'
set -g status-right '#[fg=#314054]%Y-%m-%d #[fg=#222436,bold]%H:%M #[fg=#433c40][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#c3e88d,fg=#222436,bold] #I:#W #[default]'
