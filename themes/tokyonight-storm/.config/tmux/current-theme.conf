# tokyonight-storm tmux colors
set -g pane-border-style fg=#414868
set -g pane-active-border-style fg=#e0af68
set -gu status-bg
set -gu status-fg
set -g status-style 'bg=#9ea6cc,fg=#24283b'
set -g status-left '#[fg=#24283b,bold]#S #[fg=#403c42]|'
set -g status-right '#[fg=#2d394f]%Y-%m-%d #[fg=#24283b,bold]%H:%M #[fg=#403c42][#(whoami)]'
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#[bg=#e0af68,fg=#24283b,bold] #I:#W #[default]'
