# ~/.tmux.conf

# Make prefix Ctrl-a instead of Ctrl-b
unbind C-b
set-option -g prefix C-u
bind-key C-u send-prefix

# Enable mouse support (scroll, select panes, resize panes)
set -g mouse on

# Set easier split commands
bind | split-window -h
unbind -
bind - split-window -v
unbind '"'
unbind %

# Set vim motion keys for pane navigation
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Move windows left and right
bind-key C-h swap-window -t -1
bind-key C-l swap-window -t 1

# Set vi-style key bindings in copy mode
setw -g mode-keys vi

# Enable 256 color support
set -g default-terminal "screen-256color"

# Truecolor. Without this tmux believes the OUTER terminal is 256-colour only and
# quantises every hex colour it is given -- the theme seam asks for #f9e2af and
# tmux emits SGR 48;5;223, so a themed status bar renders an approximation
# (measured #dec9a2 against the intended #f9e2af). Declaring the terminal
# RGB-capable makes it emit 48;2;<r>;<g>;<b> instead, and every theme's colours
# land exactly.
#
# This is deliberately keyed to the terminals actually used rather than "*:RGB":
# the flag is a claim about the terminal, and claiming it for something that
# cannot do truecolor mangles colour instead of degrading it. Check the outer
# TERM with `tmux display -p '#{client_termname}'` before adding one.
#
# Note this does NOT need default-terminal changed: that sets the INNER TERM that
# programs in a pane see. Switching it to tmux-256color would also buy italics,
# but the entry is missing on some systems and tmux then fails to start sessions,
# which is not a trade worth making for a cosmetic gain.
#
# terminal-features needs tmux >= 3.2; Gentoo and Fedora both ship well past it.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-kitty:RGB"

# Reload config file with 'prefix + r'
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane border fallback, for the case where no theme layer is linked. These MUST
# stay above the source-file below: tmux applies options in file order, so when
# they sat after it they silently won and every theme's pane-border-style and
# pane-active-border-style were dead -- `tmux show-options -g` reported
# fg=white/fg=magenta no matter which theme was active.
set -g pane-border-style fg=white
set -g pane-active-border-style fg=magenta

# Theme colors (provided by active dotfiles theme layer)
source-file ~/.config/tmux/current-theme.conf

# Status bar customizations
set-option -g status-position top
set -g status-left-length 40
set -g status-right-length 90

# Start window indexing at 1 for easy direct number navigation
set -g base-index 1
setw -g pane-base-index 1
