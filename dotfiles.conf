# dotfiles.conf - repository-level configuration (committed, shared).
#
# This file is an optional shell fragment sourced by the dotfiles tool. The
# tool ships with sensible defaults; use this file only to extend them.
#
# The most important setting is the container-directory set: directories that
# are shared by many applications and must NEVER be folded into a single
# symlink. The tool always keeps these as real directories and links only the
# specific children the repo manages. Append your own as needed:
#
#   DF_CONTAINER_DIRS+=(".config/fontconfig" ".vim")
#
# Add basenames that should never be treated as managed content:
#
#   DF_IGNORE_NAMES+=("lazy-lock.json")

# (defaults are defined in lib/config.sh)

# elephant loads compiled provider plugins (.so) from ~/.config/elephant/providers/.
# Keep that directory real so the binaries can never be folded or adopted; only
# the tracked providers.list manifest beside it is linked.
DF_CONTAINER_DIRS+=(".config/elephant")

# opencode manages its own state under ~/.config/opencode (node_modules,
# package.json/package-lock.json, .gitignore) and hosts machine-local, unmanaged
# content such as the agent/ directory. Only opencode.jsonc (host layer - its
# MCP server set is per-machine) and tui.json (theme layer, home-layer fallback)
# are repo-managed and linked as individual children.
# Keeping the directory a container guarantees it is never folded into a single
# symlink (which would swallow agent/ and opencode's own state into the repo) or
# adopted, regardless of how many layers contribute.
DF_CONTAINER_DIRS+=(".config/opencode")

# btop rewrites ~/.config/btop/btop.conf on exit, and the themed
# themes/current.theme is contributed by the ACTIVE THEME layer. That makes the
# set of layers owning .config/btop vary with the selected theme: when a theme
# ships no btop seam the home layer becomes the sole owner and the directory
# would be folded into a single symlink -- which collides with the real
# directory (holding the previous theme's themes/current.theme) and reports a
# CONFLICT, i.e. theme switching would break for every theme without a btop
# seam. Keep it a container so btop.conf and themes/current.theme are always
# linked as individual children.
#
# themes/ needs the same treatment one level down: the active theme layer is its
# only owner, so it would fold into a single symlink into the repo -- which both
# collides with the real directory the previous layout left behind and would
# swallow any btop theme the user drops in by hand.
DF_CONTAINER_DIRS+=(".config/btop" ".config/btop/themes")

# swaync reads ~/.config/swaync/{config.json.in,style.css} and the generator
# script beside them; the config it actually runs from is generated into
# $XDG_STATE_HOME/dotfiles/swaync/ instead, precisely so a redock rewriting the
# monitor pin never touches the repo. Keep the directory real for two reasons.
# It is currently owned by profiles/hyprland alone, so it would otherwise fold
# into a single symlink into the repo -- and any host that later shadows
# config.json.in (a single-display Fedora box wants a different pin, or none)
# flips it to two owners and back to individual children, i.e. a needless
# fold/unfold transition. More importantly, a folded directory means anything
# swaync ever writes next to its config lands in the repo rather than in $HOME.
DF_CONTAINER_DIRS+=(".config/swaync")
